# This workflow will upload a Python Package using Twine when a release is created
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python#publishing-to-package-registries

name: Upload Python Package

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        default: "patch"
        type: choice
        options:
          - major
          - minor
          - patch

permissions:
  contents: write

jobs:
  build:
    name: Bump package version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup uv
        id: setup-uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true
          cache-suffix: "uv"
          ignore-nothing-to-cache: true

      - name: Bump version
        run: uv version --bump ${{ github.event.inputs.bump }}

      - name: Get current version
        id: version
        # Assuming the bump command updates the version in pyproject.toml
        run: |
          NEW_VERSION=$(uv version --short)
          echo "tag=v$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "chore: bump version to ${{ steps.version.outputs.tag }}"
          git tag ${{ steps.version.outputs.tag }}
          git push origin HEAD
          git push origin ${{ steps.version.outputs.tag }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true

      - name: Build package
        run: uv build

      - name: Save built dist
        uses: actions/upload-artifact@v7
        with:
          path: dist/
          name: python-package-build
          if-no-files-found: error

  pypi-publish:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: pypi
      url: https://pypi.org/p/pyfwapi

    permissions:
      id-token: write # IMPORTANT: this permission is mandatory for trusted publishing

    steps:
      - uses: actions/checkout@v6

      - name: Get build artifact
        uses: actions/download-artifact@v8
        with:
          path: dist/
          name: python-package-build

      - name: Publish package
        uses: pypa/gh-action-pypi-publish@release/v1

name: Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.12", "3.13", "3.14" ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true
          cache-suffix: "uv"
          ignore-nothing-to-cache: true

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run tests with pytest
        run: uv run --python ${{ matrix.python-version }} pytest tests/

  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true
          cache-suffix: "uv"
          ignore-nothing-to-cache: true

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run tests with pytest
        run: uv run pytest tests/ --cov=src/pyfwapi --cov-report=xml
          --junitxml=pytest.xml | tee pytest-coverage.txt

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.23

      - name: Install yq
        run: go install github.com/mikefarah/yq/v4@latest

      - name: Coverage comment
        run: >
          {
            echo "| File | Line Rate | Branch Rate |"
            echo "|---|---:|---:|"

            yq -p=xml -o=yaml -r '
              .coverage.packages.package[].classes.class[]
              | select(."+@filename" != null)
              | [
                  .["+@filename"],
                  (.["+@line-rate"] // 0),
                  (.["+@branch-rate"] // 0)
                ]
              | "| " + (.[0]) + " | " + (.[1] | tostring) + "% | " + (.[2] | tostring) + "% |"
            ' coverage.xml
          } >> $GITHUB_STEP_SUMMARY
